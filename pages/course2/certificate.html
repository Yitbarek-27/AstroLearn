<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AstroLearn Certificate</title>

<link rel="stylesheet" href="../../style.css">

</head>

<body>

<script>

if(localStorage.getItem("course2ExamPassed") !== "true"){
    window.location.href = "course.html";
}

</script>


<div class="certificate-page">

    <canvas
        id="certificateCanvas"
        width="1536"
        height="1024">
    </canvas>

    <br><br>

    <button
        id="downloadBtn"
        class="complete-btn"
        onclick="downloadCertificate()"
        disabled>
        📥 Download Certificate
    </button>

    <button
        class="complete-btn"
        onclick="window.print()">
        🖨 Print Certificate
    </button>

</div>


<script>

const canvas =
    document.getElementById("certificateCanvas");

const ctx =
    canvas.getContext("2d");

const downloadBtn =
    document.getElementById("downloadBtn");


/* =====================================================
   LOAD IMAGE SAFELY
===================================================== */

function loadImage(src){

    return new Promise((resolve, reject) => {

        const image = new Image();

        image.onload = function(){
            resolve(image);
        };

        image.onerror = function(){
            reject(
                new Error("Failed to load: " + src)
            );
        };

        image.src = src;

    });

}


/* =====================================================
   GENERATE CERTIFICATE
===================================================== */

async function generateCertificate(){

    try{

        downloadBtn.disabled = true;


        /* =========================
           LOAD BOTH IMAGES
        ========================= */

        const certificate =
            await loadImage(
                "../../assets/images/certificate-template.png"
            );

        const signature =
            await loadImage(
                "../../assets/images/signature.png"
            );


        /* =========================
           CLEAR CANVAS
        ========================= */

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* =========================
           TEMPLATE
        ========================= */

        ctx.drawImage(
            certificate,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* =========================
           SIGNATURE
        ========================= */

        ctx.drawImage(
            signature,
            620,
            780,
            300,
            90
        );


        /* =========================
           STUDENT
        ========================= */

        const student =
            localStorage.getItem("studentName")
            || "Student Name";


        ctx.textAlign = "center";

        ctx.fillStyle = "#112240";


        let size = 62;

        ctx.font =
            `italic bold ${size}px Georgia`;


        while(
            ctx.measureText(student).width > 900 &&
            size > 35
        ){

            size -= 2;

            ctx.font =
                `italic bold ${size}px Georgia`;

        }


        ctx.fillText(
            student,
            canvas.width / 2,
            435
        );


        /* =========================
           COURSE
        ========================= */

        const course =
            localStorage.getItem("course2Name")
            || "Solar System Explorer";


        ctx.fillStyle = "#c9981c";


        let courseSize = 32;

        ctx.font =
            `bold ${courseSize}px Georgia`;


        while(
            ctx.measureText(course).width > 700 &&
            courseSize > 22
        ){

            courseSize -= 2;

            ctx.font =
                `bold ${courseSize}px Georgia`;

        }


        ctx.fillText(
            course,
            canvas.width / 2,
            692
        );


        /* =========================
           DATE
        ========================= */

        const options = {
            day: "2-digit",
            month: "short",
            year: "numeric"
        };


        const date =
            new Date().toLocaleDateString(
                "en-US",
                options
            );


        ctx.fillStyle = "#1f2937";

        ctx.font = "26px Poppins";


        ctx.fillText(
            date,
            433,
            873
        );


        /* =========================
           CERTIFICATE ID
        ========================= */

        let id =
            localStorage.getItem(
                "course2CertificateID"
            );


        if(!id){

            const year =
                new Date()
                .getFullYear()
                .toString()
                .slice(-2);


            const random =
                Math.floor(
                    1000 + Math.random() * 9000
                );


            id =
                `ALA${year}-${random}`;


            localStorage.setItem(
                "course2CertificateID",
                id
            );

        }


        ctx.fillText(
            id,
            1085,
            873
        );


        /* =========================
           READY
        ========================= */

        downloadBtn.disabled = false;


    }catch(error){

        console.error(
            "Certificate generation failed:",
            error
        );


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.textAlign = "center";

        ctx.fillStyle = "#ffffff";

        ctx.font = "28px Poppins";


        ctx.fillText(
            "Unable to load certificate. Please refresh the page.",
            canvas.width / 2,
            canvas.height / 2
        );

    }

}


/* =====================================================
   DOWNLOAD CERTIFICATE
===================================================== */

function downloadCertificate(){

    const link =
        document.createElement("a");


    link.download =
        "AstroLearn-Solar-System-Explorer-Certificate.png";


    link.href =
        canvas.toDataURL(
            "image/png",
            1.0
        );


    link.click();

}


/* =====================================================
   START
===================================================== */

generateCertificate();

</script>

</body>

</html>

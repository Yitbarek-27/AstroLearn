/* =========================================================
   EXAM ANSWERS
   ========================================================= */

const answers = {

    q1:"b",
    q2:"b",
    q3:"c",
    q4:"b",
    q5:"a",
    q6:"c",
    q7:"b",

    q9:"c",
    q10:"c",
    q11:"b",
    q12:"b",
    q13:"b",
    q14:"b",
    q15:"c",
    q16:"a",
    q17:"b",
    q18:"b",
    q19:"a",
    q20:"b"

};


/* =========================================================
   SUBMIT EXAM
   ========================================================= */

function submitExam(){

    let score = 0;

    let unanswered = 0;


    for(let question in answers){

        const selected =
            document.querySelector(
                `input[name="${question}"]:checked`
            );


        if(!selected){

            unanswered++;

        }
        else if(selected.value === answers[question]){

            score++;

        }

    }


    /* Don't submit if questions are unanswered */

    if(unanswered > 0){

        alert(
            `Please answer all 20 questions before submitting. You still have ${unanswered} unanswered question(s).`
        );

        return;

    }


    const percentage =
        Math.round((score / 20) * 100);


    const result =
        document.getElementById("result");


    result.style.display = "block";


    /* ---------- PASSED ---------- */

    if(percentage >= 70){

    /* Save exam completion */

    localStorage.setItem(
        "course2ExamPassed",
        "true"
    );

    localStorage.setItem(
        "course2ExamScore",
        score
    );

    localStorage.setItem(
        "course2Name",
        "Solar System Explorer"
    );

    localStorage.setItem(
        "course2MissionName",
        "Mission 2"
    );

    /* Go directly to Congratulations page */

    window.location.href = "congratulations.html";

}


    /* ---------- FAILED ---------- */

    else{

        document.getElementById("resultTitle").textContent =
            "📚 Keep Learning!";


        document.getElementById("resultTitle").className =
            "fail";


        document.getElementById("resultText").textContent =
            `You scored ${score}/20 (${percentage}%). You need 70% to pass. Review the lessons and try again.`;


        document.getElementById("certificateArea").innerHTML = `

            <p style="margin-top:20px;color:#cbd5e1;">
                You can review the lessons and retake the exam.
            </p>

        `;

    }


    window.scrollTo({

        top:document.body.scrollHeight,

        behavior:"smooth"

    });

}
